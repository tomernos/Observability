apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    email: tomer_nos1@walla.com
    server: https://acme-v02.api.letsencrypt.org/directory   # use staging below first
    privateKeySecretRef:
      name: letsencrypt-http01-key
    solvers:
      - http01:
          ingress:
            class: nginx 


---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: argocd
spec:
  secretName: argocd-tls
  duration: 2160h                        # 90d (default)
  renewBefore: 360h                      # 15d before expiry
  dnsNames:
    - argocd.tomernos.xyz                   # domain(s) for the cert
  issuerRef:
    name: letsencrypt-http01             # your ClusterIssuer name
    kind: ClusterIssuer
  privateKey:
        rotationPolicy: Never