apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  amiSelectorTerms:
    - id: "" # optional, left blank to allow default EKS optimized resolution
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: tnt-eu-observability-dev-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: tnt-eu-observability-dev-eks
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        karpenter.sh/nodepool: default
    spec:
      nodeClassRef:
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [t3.small, t3a.small]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
