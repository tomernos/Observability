grafana:
  enabled: true
  
  # Change this password!
  adminPassword: "admin123"
  
  # Access Grafana from outside the cluster
  service:
    type: LoadBalancer

# Prometheus Operator Configuration
prometheus:
  enabled: true
  
  # Discover ServiceMonitors in ALL namespaces (TIER6: Multi-app support)
  prometheusSpec:
    # Empty selector = discover ALL ServiceMonitors (not just monitoring namespace)
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    
    # Also discover PodMonitors in all namespaces
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    
    # Retention period
    retention: 30d
    
    # Resource limits (reduced for dev environment should be )
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 250m
