# Promtail Configuration - Log Collector
# Runs as DaemonSet on every node, collects pod logs

config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

# DaemonSet configuration (runs on each node)
daemonset:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Collect all pod logs
config:
  snippets:
    pipelineStages:
      - cri: {}

