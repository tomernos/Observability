
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
  annotations:
    kubernetes.io/description: "General purpose NodePool for generic workloads"
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot","on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small","t3.medium","t3a.small","t3a.medium","m5.large"]

  # Move disruption to the correct level
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  
spec:
  # The IAM role name (instance profile) Karpenter attaches to new nodes
  role: "karp-tnt-eu-d-eks"  # ← put your real node role/instance profile name

  # Choose AMI (either amiFamily or selector terms)
  amiSelectorTerms:
    - alias: bottlerocket@latest # Bottlerocket

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "tnt-eu-observability-dev-eks"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "tnt-eu-observability-dev-eks"

