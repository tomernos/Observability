apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-test
  namespace: default
  labels:
    app: busybox-test
    purpose: pod-limit-testing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: busybox-test
  template:
    metadata:
      labels:
        app: busybox-test
        purpose: pod-limit-testing
    spec:
      containers:
      - name: busybox
        image: busybox:1.36
        command: 
        - sleep
        - "360"  # Sleep for 6 minutes
        resources:
          requests:
            cpu: 10m      # Very low CPU request
            memory: 16Mi  # Very low memory request
          limits:
            cpu: 50m      # Low CPU limit
            memory: 32Mi  # Low memory limit
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 5
---
