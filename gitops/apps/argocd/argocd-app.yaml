# Bootstrap ArgoCD - Manages itself and other apps
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.7.12  # Stable version
    
    helm:
      values: |
        # ArgoCD server configuration
        server:
          service:
            type: LoadBalancer  # Expose ArgoCD UI via AWS ELB
          
        # Enable notifications
        notifications:
          enabled: true
        
        # Resource limits
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
