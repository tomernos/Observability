apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: karpenter

resources:
  - nodepool.yaml

helmCharts:
  - name: karpenter
    repo: oci://public.ecr.aws/karpenter/karpenter
    version: 1.0.8
    namespace: karpenter
    releaseName: karpenter
    valuesInline:
      replicas: 1
      settings:
        clusterName: tnt-eu-observability-dev-eks
        clusterEndpoint: https://0225118442067E2CF58DE7E54EF7A3AF.gr7.eu-central-1.eks.amazonaws.com
        interruptionQueue: tnt-eu-observability-dev-eks-karpenter
      logLevel: debug
      webhook:
        enabled: false
